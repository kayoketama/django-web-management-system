{% extends "base.html" %}

{% block title %}
Delete Message - My Website
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-5 text-center">

                <div class="display-3 mb-3">
                    ⚠️
                </div>

                <h1 class="fw-bold mb-3">
                    Delete Message
                </h1>

                <p class="text-muted">
                    Are you sure you want to delete this message?
                </p>

                <div class="alert alert-warning text-start">

                    <p class="mb-2">
                        <strong>Name:</strong>
                        {{ message.name }}
                    </p>

                    <p class="mb-2">
                        <strong>Email:</strong>
                        {{ message.email }}
                    </p>

                    <p class="mb-0">
                        <strong>Message:</strong>
                        {{ message.message }}
                    </p>

                </div>

                <div class="d-flex justify-content-center gap-2 mt-4">

                    <a href="{% url 'admin_messages' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <form method="post"
                          action="{% url 'admin_message_delete' message.id %}">

                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-danger">
                            🗑️ Yes, Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
