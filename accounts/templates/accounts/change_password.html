{% extends "base.html" %}

{% block title %}
Change Password - My Website
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">
                    Change Password
                </h2>

                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}

                {% if success %}

                    <div class="alert alert-success">
                        {{ success }}
                    </div>

                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Current Password
                        </label>

                        <input type="password"
                               name="current_password"
                               class="form-control"
                               placeholder="Enter current password"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input type="password"
                               name="new_password"
                               class="form-control"
                               placeholder="Enter new password"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input type="password"
                               name="confirm_password"
                               class="form-control"
                               placeholder="Confirm new password"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Change Password
                    </button>

                </form>

                <div class="text-center mt-4">

                    <a href="{% url 'dashboard' %}"
                       class="btn btn-outline-secondary">
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
